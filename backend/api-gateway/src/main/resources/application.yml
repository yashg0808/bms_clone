server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Movie Service Routes
        - id: movie-service-movies
          uri: http://${MOVIE_SERVICE_HOST:localhost}:${MOVIE_SERVICE_PORT:8085}
          predicates:
            - Path=/api/v1/movies/**

        - id: movie-service-cities
          uri: http://${MOVIE_SERVICE_HOST:localhost}:${MOVIE_SERVICE_PORT:8085}
          predicates:
            - Path=/api/v1/cities/**

        - id: movie-service-theaters
          uri: http://${MOVIE_SERVICE_HOST:localhost}:${MOVIE_SERVICE_PORT:8085}
          predicates:
            - Path=/api/v1/theaters/**

        - id: movie-service-shows
          uri: http://${MOVIE_SERVICE_HOST:localhost}:${MOVIE_SERVICE_PORT:8085}
          predicates:
            - Path=/api/v1/shows/**

        - id: movie-service-layouts
          uri: http://${MOVIE_SERVICE_HOST:localhost}:${MOVIE_SERVICE_PORT:8085}
          predicates:
            - Path=/layouts/**

        # Booking Service Routes
        - id: booking-service
          uri: http://${BOOKING_SERVICE_HOST:localhost}:${BOOKING_SERVICE_PORT:8083}
          predicates:
            - Path=/api/v1/bookings/**

        - id: seat-service
          uri: http://${BOOKING_SERVICE_HOST:localhost}:${BOOKING_SERVICE_PORT:8083}
          predicates:
            - Path=/api/v1/seats/**

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}

waiting-room:
  enabled: ${WAITING_ROOM_ENABLED:true}
  max-threshold: ${WAITING_ROOM_MAX_THRESHOLD:5000}
  session-ttl-seconds: ${WAITING_ROOM_SESSION_TTL:300}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.bookmyshow.gateway: DEBUG
    org.springframework.cloud.gateway: INFO

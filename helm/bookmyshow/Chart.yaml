apiVersion: v2
name: bookmyshow
description: A Helm chart for BookMyShow clone microservices
type: application
version: 1.0.0
appVersion: "1.0.0"

dependencies:
  - name: postgresql
    version: "13.2.24"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "18.6.1"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: kafka
    version: "26.6.2"
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
  - name: elasticsearch
    version: "19.16.1"
    repository: https://charts.bitnami.com/bitnami
    condition: elasticsearch.enabled
